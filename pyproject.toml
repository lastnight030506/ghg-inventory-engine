[project]
name = "ghg-inventory-engine"
version = "1.0.0"
description = "GHG inventory (Scope 1/2) and Gaussian-plume dispersion engine for an exporting manufacturer"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "fpdf2>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
ghg = "ghg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
