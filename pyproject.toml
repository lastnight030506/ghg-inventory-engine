[project]
name = "ghg-inventory-engine"
version = "1.0.0"
description = "GHG inventory (Scope 1/2) and Gaussian-plume dispersion engine for an exporting manufacturer"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "fpdf2>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.11", "pypdf>=5.0"]

[project.scripts]
ghg = "ghg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghg"]

# The sample data ships inside the wheel so an installed `ghg` works with no
# checkout: the CLI resolves its defaults through ghg.paths, which looks for
# ghg/data/. Without this the install is unusable outside the repo root.
[tool.hatch.build.targets.wheel.force-include]
"data" = "ghg/data"

[tool.hatch.build.targets.sdist.force-include]
"data" = "ghg/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
# explicit_package_bases lets mypy resolve `from . import x` when the sources are
# checked by path rather than as an installed package.
explicit_package_bases = true
mypy_path = "src"
files = ["src/ghg"]
ignore_missing_imports = true
# No implicit-optional relaxation: `PlumeState | None` must be narrowed before use,
# which is exactly the class of bug this setting caught.
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["ghg"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
