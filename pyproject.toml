[project]
name = "ghg-inventory-engine"
version = "1.0.0"
description = "GHG inventory (Scope 1/2) and Gaussian-plume dispersion engine for an exporting manufacturer"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "fpdf2>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[project.scripts]
ghg = "ghg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ghg"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
